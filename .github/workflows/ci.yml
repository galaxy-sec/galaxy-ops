name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features -- --test-threads=1

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v1.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info  -- --test-threads=1

      # 选项1: 使用 Coveralls
      - name: Upload to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: lcov.info
          format: lcov

      # 选项2: 使用 GitHub Artifacts 作为备选
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: failure() # 如果Coveralls失败，保留lcov文件
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 30

  musl-static:
    name: Musl Static Link Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl
      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build with musl
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Validate static linking
        run: |
          STATIC_BINARY=target/x86_64-unknown-linux-musl/release/gops
          if [ -f "$STATIC_BINARY" ]; then
            echo "Checking static linking for musl binary..."
            ldd_output=$(ldd "$STATIC_BINARY" 2>&1)
            if echo "$ldd_output" | grep -q "not a dynamic executable"; then
              echo "✅ Binary is statically linked"
            else
              echo "❌ Binary is not statically linked"
              echo "ldd output: $ldd_output"
              exit 1
            fi
          else
            echo "❌ Musl binary not found at $STATIC_BINARY"
            exit 1
          fi
      - name: Test musl binary basic functionality
        run: |
          STATIC_BINARY=target/x86_64-unknown-linux-musl/release/gops
          if [ -f "$STATIC_BINARY" ]; then
            echo "Testing musl binary basic functionality..."
            chmod +x "$STATIC_BINARY"
            "$STATIC_BINARY" --version || echo "Binary exists but version check failed"
          fi
