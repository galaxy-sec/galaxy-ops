name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 with glibc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: Linux

          # Linux x86_64 with musl (static linking)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: Linux musl

          # macOS ARM64 (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macOS ARM

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --verbose --target ${{ matrix.target }}

      - name: Unit tests
        run: cargo test --verbose --target ${{ matrix.target }} --all-features -- --test-threads=1

      - name: Build musl static binary (if musl target)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: RUSTFLAGS="-C target-feature=+crt-static" cargo build --release --target ${{ matrix.target }}

      - name: Verify musl static linking
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          ldd ./target/${{ matrix.target }}/release/gops | grep -q "not a dynamic executable" && echo "✅ Static binary confirmed" || exit 1

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run clippy
        run: cargo clippy -- -D warnings
