name: Release

# Only do the release on x.y.z tags.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

# We need this to be able to create releases.
permissions:
  contents: write

jobs:
  # The create-release job runs purely to initialize the GitHub release itself,
  # and names the release after the `x.y.z` tag that was pushed. It's separate
  # from building the release so that we only create the release once.
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ env.VERSION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get the release version from the tag
        run: echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Show the version
        run: |
          echo "version is: $VERSION"

      - name: Check that tag version and Cargo.toml version are the same
        shell: bash
        run: |
          if ! grep -q "version = \"$VERSION\"" Cargo.toml; then
            echo "version does not match Cargo.toml" >&2
            echo "Expected version: $VERSION"
            echo "Cargo.toml contains:"
            grep "version" Cargo.toml
            exit 1
          fi

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create $VERSION --draft --verify-tag --title "GalaxyFlow $VERSION"

  # Build and upload release artifacts
  build-release:
    name: Build Release
    needs: ["create-release"]
    runs-on: ${{ matrix.os }}
    env:
      # For cross compilation
      CARGO: cargo
      TARGET_FLAGS: ""
      TARGET_DIR: ./target
      # Cross version - pinned for stability
      CROSS_VERSION: v0.2.5
      # Emit backtraces on panics
      RUST_BACKTRACE: 1
      # Static linking environment
      PKG_CONFIG_ALL_STATIC: "1"
      LIBZ_SYS_STATIC: "1"
      OPENSSL_STATIC: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux static builds (fully static)
          - build: linux-musl
            os: ubuntu-latest
            rust: stable
            target: x86_64-unknown-linux-musl
            strip: x86_64-linux-musl-strip
            static: true

          - build: linux-gnu
            os: ubuntu-latest
            rust: stable
            target: x86_64-unknown-linux-gnu
            strip: x86_64-linux-gnu-strip

          - build: linux-arm64
            os: ubuntu-latest
            rust: stable
            target: aarch64-unknown-linux-gnu
            strip: aarch64-linux-gnu-strip

          # macOS builds
          - build: macos-intel
            os: macos-latest
            rust: stable
            target: x86_64-apple-darwin
            strip: strip

          - build: macos-arm
            os: macos-latest
            rust: stable
            target: aarch64-apple-darwin
            strip: strip

          # Windows builds
          - build: windows-msvc
            os: windows-latest
            rust: stable
            target: x86_64-pc-windows-msvc

          - build: windows-gnu
            os: windows-latest
            rust: stable
            target: x86_64-pc-windows-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install packages (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools pkg-config libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.target }}

      - name: Use Cross (Linux targets)
        if: matrix.os == 'ubuntu-latest' && matrix.target != 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          # Pin cross version for stability
          dir="$RUNNER_TEMP/cross-download"
          mkdir "$dir"
          echo "$dir" >> $GITHUB_PATH
          cd "$dir"
          curl -LO "https://github.com/cross-rs/cross/releases/download/$CROSS_VERSION/cross-x86_64-unknown-linux-musl.tar.gz"
          tar xf cross-x86_64-unknown-linux-musl.tar.gz
          echo "CARGO=cross" >> $GITHUB_ENV
          echo "TARGET_FLAGS=--target
